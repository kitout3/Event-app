name: Deploy Firebase backend

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mariage-hq
          workload_identity_provider: projects/1069749088466/locations/global/workloadIdentityPools/github/providers/mariage-app
          service_account: github-firebase-deployer@mariage-hq.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Deploy Firestore and Storage rules
        run: |
          npx --yes firebase-tools@latest deploy \
            --project mariage-hq \
            --only firestore:rules,storage \
            --non-interactive

  functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: mariage-hq
          workload_identity_provider: projects/1069749088466/locations/global/workloadIdentityPools/github/providers/mariage-app
          service_account: github-firebase-deployer@mariage-hq.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Check Functions syntax
        run: |
          node --check functions/index.js
          node --check functions/event-config.js
          node --check functions/billing-config.js

      - name: Deploy Functions
        run: |
          npx --yes firebase-tools@latest deploy \
            --project mariage-hq \
            --only functions \
            --non-interactive
