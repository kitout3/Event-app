name: Deploy Firebase backend

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase-backend.yml"
  workflow_dispatch:
    inputs:
      deploy_stripe:
        description: Deploy Stripe-backed payment Functions (requires Firebase secrets)
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  FIREBASE_TOOLS_VERSION: "15.30.2"

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: mariage-hq
          workload_identity_provider: projects/1069749088466/locations/global/workloadIdentityPools/github/providers/mariage-app
          service_account: github-firebase-deployer@mariage-hq.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      - name: Deploy Firestore and Storage rules
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --project mariage-hq \
            --only firestore:rules,storage \
            --non-interactive

  core_functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: mariage-hq
          workload_identity_provider: projects/1069749088466/locations/global/workloadIdentityPools/github/providers/mariage-app
          service_account: github-firebase-deployer@mariage-hq.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Check Functions syntax
        run: |
          node --check functions/index.js
          node --check functions/event-config.js
          node --check functions/billing-config.js

      - name: Deploy core Functions
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --project mariage-hq \
            --only functions:createWedding,functions:createWeddingV2,functions:listPublicVideos,functions:updateWedding,functions:deleteWedding,functions:listWeddings,functions:createClientEventDraft,functions:listMyEvents,functions:notifyNewPendingVideoV2 \
            --non-interactive

  stripe_functions:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_stripe }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google Cloud
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: mariage-hq
          workload_identity_provider: projects/1069749088466/locations/global/workloadIdentityPools/github/providers/mariage-app
          service_account: github-firebase-deployer@mariage-hq.iam.gserviceaccount.com
          create_credentials_file: true
          token_format: access_token

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund

      - name: Check Functions syntax
        run: node --check functions/index.js

      - name: Deploy Stripe Functions
        run: |
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
            --project mariage-hq \
            --only functions:createEventCheckoutSession,functions:confirmEventCheckout,functions:stripeWebhook \
            --non-interactive
